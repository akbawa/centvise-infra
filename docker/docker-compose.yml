name: ${PROJECT_NAME}-${ENV_NAME}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

networks:
  app_network:
    name: ${PROJECT_NAME}-${ENV_NAME}-network
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}

services:
  backend:
    image: ${BACKEND_IMAGE_REPOSITORY:?Set BACKEND_IMAGE_REPOSITORY}:${BACKEND_IMAGE_TAG:?Set BACKEND_IMAGE_TAG}
    user: "${BACKEND_UID:-10001}:${BACKEND_GID:-10001}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ${PROJECT_ROOT}/infra/environments/${ENV_NAME}/backend.env
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${BACKEND_PORT}:4000"
    volumes:
      - type: bind
        source: ${PROJECT_ROOT}/data/${ENV_NAME}/backend-files
        target: /var/lib/centvise
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    healthcheck:
      test: ["CMD", "node", "-e", "const s=require('net').connect(4000,'127.0.0.1');s.setTimeout(3000);s.on('connect',()=>{s.end();process.exit(0)});s.on('timeout',()=>process.exit(1));s.on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s
    stop_grace_period: 60s
    networks:
      - app_network
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    image: ${FRONTEND_IMAGE_REPOSITORY:?Set FRONTEND_IMAGE_REPOSITORY}:${FRONTEND_IMAGE_TAG:?Set FRONTEND_IMAGE_TAG}
    environment:
      # The React bundle calls /api on this frontend. Its Nginx container
      # removes that gateway prefix and forwards requests over Docker's
      # private network to the backend service.
      BACKEND_UPSTREAM: http://backend:4000
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${FRONTEND_PORT}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - app_network
    restart: unless-stopped
    logging: *default-logging
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      # nginx-unprivileged renders the BACKEND_UPSTREAM template here during
      # startup. Keep the image read-only and allow only this in-memory path.
      - /etc/nginx/conf.d:rw,noexec,nosuid,nodev,size=1m,mode=0755,uid=101,gid=101
    deploy:
      resources:
        limits:
          memory: 256M

